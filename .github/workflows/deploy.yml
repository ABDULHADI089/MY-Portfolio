name: Deploy portfolio

on:
  push:
    branches:
      - main
      - claude/portfolio-website-setup-57g0zk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Pages must already be enabled on the repository:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # The workflow token is not permitted to create the Pages site itself, so
      # the base path is set explicitly rather than read from this step's
      # outputs. That keeps the build working even if this step is unhappy.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Build static export
        env:
          # Pages serves this repo from /MY-Portfolio, not from the domain root.
          NEXT_PUBLIC_BASE_PATH: /MY-Portfolio
          NEXT_PUBLIC_SITE_URL: https://abdulhadi089.github.io/MY-Portfolio
          # Optional: add a WEB3FORMS_KEY repo secret to have the contact form
          # deliver straight to the inbox instead of opening a mail client.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - name: Disable Jekyll processing
        # Without this, Pages strips the _next/ directory and the site loads unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Pages creates a `github-pages` environment restricted to the default branch,
  # so a deploy attempted from any other branch is refused:
  #   Branch "..." is not allowed to deploy to github-pages due to
  #   environment protection rules.
  # Feature branches therefore build and validate only; main publishes.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
